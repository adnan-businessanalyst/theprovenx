        questionSlug: { type: string }
        questionTitle: { type: string }
        score: { type: integer }
        createdAt: { type: string }
      required: [type, questionId, questionSlug, questionTitle, score, createdAt]
    Question:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        body: { type: string }
        language: { type: string }
        author:
          $ref: "#/components/schemas/User"
        tags:
          type: array
          items: { type: string }
        category:
          oneOf:
            - $ref: "#/components/schemas/CategoryRef"
            - type: "null"
        score: { type: integer }
        answerCount: { type: integer }
        viewCount: { type: integer }
        hasAcceptedAnswer: { type: boolean }
        isFeatured: { type: boolean }
        status:
          type: string
          enum: [published, pending_review, suspended]
        myVote: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        [id, slug, title, body, language, author, tags, score, answerCount, viewCount, hasAcceptedAnswer, isFeatured, status, createdAt, updatedAt]
    QuestionDetail:
      type: object
      properties:
        question:
          $ref: "#/components/schemas/Question"
