openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: questions
  - name: answers
  - name: comments
  - name: tagsApi
  - name: categories
  - name: search
  - name: notifications
  - name: translation
  - name: flags
  - name: admin
  - name: stats
  - name: sponsors
paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (revoke session cookie / bearer token)
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current authenticated user (session cookie or Bearer)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email (always returns generic success)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/top:
    get:
      operationId: listTopUsers
      tags: [users]
      summary: Top contributors leaderboard
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Top users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/top-verifiers:
    get:
      operationId: listTopVerifiers
      tags: [users]
      summary: Members with the most accepted (verified) answers in the last 30 days
      responses:
        "200":
          description: Top verifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopVerifier"
  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public profile with stats
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /users/{username}/activity:
    get:
      operationId: getUserActivity
      tags: [users]
      summary: Recent activity for a user
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, active, votes, unanswered]
            default: newest
        - name: tag
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated questions (featured first on page 1 of newest)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Ask a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /questions/featured:
    get:
      operationId: listFeaturedQuestions
      tags: [questions]
      summary: Pinned/featured questions
      responses:
        "200":
          description: Featured questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
  /questions/{slug}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get question detail by slug (increments view count)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Question detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /questions/{id}/vote:
    post:
      operationId: voteQuestion
      tags: [questions]
      summary: Vote on a question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: New score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
  /questions/{id}/answers:
    post:
      operationId: createAnswer
      tags: [answers]
      summary: Post an answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "201":
          description: Created answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
  /questions/{id}/related:
    get:
      operationId: listRelatedQuestions
      tags: [questions]
      summary: Related questions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Related questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
  /answers/{id}/vote:
    post:
      operationId: voteAnswer
      tags: [answers]
      summary: Vote on an answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: New score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
  /answers/{id}/accept:
    post:
      operationId: acceptAnswer
      tags: [answers]
      summary: Mark answer as accepted (question author only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Accepted answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "403":
          description: Not the question author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /comments:
    post:
      operationId: createComment
      tags: [comments]
      summary: Comment on a question or answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories with question counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryInfo"
  /tags:
    get:
      operationId: listTags
      tags: [tagsApi]
      summary: List tags with question counts
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagInfo"
  /search:
    get:
      operationId: searchQuestions
      tags: [search]
      summary: Full-text search across questions and answers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: unanswered
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List my notifications
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Notifications with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read (all, or specific ids)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /translate:
    post:
      operationId: translateContent
      tags: [translation]
      summary: Translate a question or answer to English or Arabic (cached)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationRequest"
      responses:
        "200":
          description: Translated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
  /flags:
    post:
      operationId: createFlag
      tags: [flags]
      summary: Report content as spam/abusive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagInput"
      responses:
        "201":
          description: Flag recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sponsor-inquiries:
    post:
      operationId: createSponsorInquiry
      tags: [sponsors]
      summary: Submit a sponsor/advertising inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInquiryInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/sponsor-inquiries:
    get:
      operationId: listSponsorInquiriesAdmin
      tags: [admin]
      summary: List sponsor inquiries (admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, closed]
      responses:
        "200":
          description: Sponsor inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SponsorInquiry"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/sponsor-inquiries/{id}:
    patch:
      operationId: updateSponsorInquiryAdmin
      tags: [admin]
      summary: Update a sponsor inquiry's follow-up status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInquiryStatusUpdate"
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorInquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /stats/summary:
    get:
      operationId: getCommunityStats
      tags: [stats]
      summary: Community-wide stats for the home page
      responses:
        "200":
          description: Community stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityStats"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/flags:
    get:
      operationId: listFlags
      tags: [admin]
      summary: List open content flags
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flag"
  /admin/flags/{id}/resolve:
    post:
      operationId: resolveFlag
      tags: [admin]
      summary: Resolve a flag (dismiss or remove content)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagResolution"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/users:
    get:
      operationId: listUsersAdmin
      tags: [admin]
      summary: List users for moderation
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /admin/users/{id}:
    patch:
      operationId: updateUserAdmin
      tags: [admin]
      summary: Update user role / suspension
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /admin/questions:
    get:
      operationId: listQuestionsAdmin
      tags: [admin]
      summary: List all questions for moderation
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [published, pending_review, suspended]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
  /admin/questions/{id}:
    delete:
      operationId: deleteQuestionAdmin
      tags: [admin]
      summary: Remove a question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateQuestionAdmin
      tags: [admin]
      summary: Update question moderation fields (status, featured)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionAdminUpdate"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
  /admin/answers/{id}:
    delete:
      operationId: deleteAnswerAdmin
      tags: [admin]
      summary: Remove an answer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/tags:
    post:
      operationId: createTagAdmin
      tags: [admin]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagInfo"
  /admin/categories:
    post:
      operationId: createCategoryAdmin
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryInfo"
  /admin/categories/{id}:
    patch:
      operationId: updateCategoryAdmin
      tags: [admin]
      summary: Edit a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryInfo"
    delete:
      operationId: deleteCategoryAdmin
      tags: [admin]
      summary: Delete a category (questions keep working, become uncategorized)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/tags/{id}:
    patch:
      operationId: updateTagAdmin
      tags: [admin]
      summary: Edit a tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagInfo"
    delete:
      operationId: deleteTagAdmin
      tags: [admin]
      summary: Delete a tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/transactions:
    get:
      operationId: listTransactionsAdmin
      tags: [admin]
      summary: List payment transactions (payment-gateway-ready scaffolding)
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiMessage:
      type: object
      properties:
        message: { type: string }
      required: [message]
    RegisterInput:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128 }
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-z0-9_-]+$"
          description: Unique handle; no spaces. Letters, numbers, underscore, hyphen only.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Alias name shown in the UI (not unique; spaces allowed)
      required: [email, password, username, displayName]
    LoginInput:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
      required: [currentPassword, newPassword]
    ForgotPasswordInput:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
      required: [email]
    ResetPasswordInput:
      type: object
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [token, password]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: Opaque session token for Bearer auth (mobile). Also set as httpOnly cookie for web.
      required: [user, token]
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        reputation: { type: integer }
        role:
          type: string
          enum: [member, moderator, admin, platform_owner]
        plan:
          type: string
          enum: [free, pro]
        isSuspended: { type: boolean }
        questionCount: { type: integer }
        answerCount: { type: integer }
        acceptedAnswerCount: { type: integer }
        createdAt: { type: string }
      required:
        [id, username, displayName, reputation, role, plan, isSuspended, questionCount, answerCount, acceptedAnswerCount, createdAt]
    UserProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        badges:
          type: array
          items: { type: string }
        topTags:
          type: array
          items:
            $ref: "#/components/schemas/TagInfo"
        recentQuestions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        recentAnswers:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required: [user, badges, topTags, recentQuestions, recentAnswers]
    TopVerifier:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        verifiedCount: { type: integer }
      required: [user, verifiedCount]
