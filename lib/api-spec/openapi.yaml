          type: array
          items: { type: string }
          minItems: 0
          maxItems: 5
          description: Optional for most categories; at least one required when categorySlug is "other" (max 5)
        categorySlug: { type: string, minLength: 1 }
        language: { type: string }
        website: { type: string, description: "Honeypot field - must be empty" }
      required: [title, body, categorySlug]
    QuestionAdminUpdate:
      type: object
      properties:
        isFeatured: { type: boolean }
        status:
          type: string
          enum: [published, pending_review, suspended]
    SiteSettings:
      type: object
      properties:
        questionsRequireReview: { type: boolean }
      required: [questionsRequireReview]
    SiteSettingsUpdate:
      type: object
      properties:
        questionsRequireReview: { type: boolean }
      required: [questionsRequireReview]
    Answer:
      type: object
      properties:
        id: { type: integer }
        questionId: { type: integer }
        body: { type: string }
        language: { type: string }
        author:
          $ref: "#/components/schemas/User"
        score: { type: integer }
        isAccepted: { type: boolean }
        myVote: { type: ["integer", "null"] }
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        createdAt: { type: string }
      required: [id, questionId, body, language, author, score, isAccepted, comments, createdAt]
    AnswerInput:
